name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Akay.Be.slnx

      - name: Build
        run: dotnet build Akay.Be.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Akay.Be.slnx --no-build --configuration Release
