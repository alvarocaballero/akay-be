name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        env:
          GITHUB_PACKAGES_USERNAME: alvarocaballero
          GITHUB_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_READ_TOKEN }}
        run: dotnet restore Akay.Be.slnx

      - name: Build
        run: dotnet build Akay.Be.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Akay.Be.slnx --no-build --configuration Release
